name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          change_range=
          case "$EVENT_NAME" in
            pull_request)
              change_range="$PR_BASE_SHA..$PR_HEAD_SHA"
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
                git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
                change_range="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
              fi
              ;;
          esac

          heavy=true
          if [[ -n "$change_range" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$change_range")
            if (( ${#changed_files[@]} > 0 )); then
              heavy=false
              for changed_file in "${changed_files[@]}"; do
                case "$changed_file" in
                  README.md|CHANGELOG.md|LICENSE|NOTICE|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                    ;;
                  *)
                    heavy=true
                    break
                    ;;
                esac
              done
            fi
            git diff --check "$change_range"
          fi

          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "range=$change_range" >> "$GITHUB_OUTPUT"

      - name: Validate Conventional Commits
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          CHANGE_RANGE: ${{ steps.changes.outputs.range }}
        run: |
          set -euo pipefail

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'
          branch_pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[a-z0-9._/-]+$'

          validate_subject() {
            local label="$1"
            local subject="$2"
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::$label is not a Conventional Commit: $subject"
              return 1
            fi
          }

          failed=0
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            validate_subject "Pull request title" "$PR_TITLE" || failed=1
            normalized_head_ref="${PR_HEAD_REF,,}"
            if [[ ! "$normalized_head_ref" =~ $branch_pattern ]] &&
              [[ ! "$normalized_head_ref" =~ ^dependabot/ ]] &&
              [[ ! "$normalized_head_ref" =~ ^release-please-- ]]; then
              echo "::error::Pull request branch is not Conventional: $PR_HEAD_REF"
              failed=1
            fi
          fi

          range="${CHANGE_RANGE:-HEAD^..HEAD}"
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            validate_subject "Commit subject" "$subject" || failed=1
          done < <(git log --no-merges --format=%s "$range")

          exit "$failed"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.heavy == 'true'
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.changes.outputs.heavy == 'true'
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: steps.changes.outputs.heavy == 'true'
        with:
          cache-disabled: true

      - name: Verify release policy
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq empty release-please-config.json
          for type in build chore ci docs refactor style test; do
            jq -e \
              --arg type "$type" \
              'any(.["changelog-sections"][]; .type == $type and .hidden == true)' \
              release-please-config.json >/dev/null
          done

      - name: Verify generated Go models
        if: steps.changes.outputs.heavy == 'true'
        run: scripts/verify-generated-models.sh

      - name: Verify release convergence on supported PostgreSQL versions
        if: steps.changes.outputs.heavy == 'true'
        run: scripts/test-release-convergence-contract.sh

      - name: Test Go packages
        if: steps.changes.outputs.heavy == 'true'
        run: go test ./...

      - name: Build and test Java package
        if: steps.changes.outputs.heavy == 'true'
        run: ./gradlew clean build --no-daemon --warning-mode=fail

      - name: Verify packaged schema resource inventory
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t model_jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print
          )
          if (( ${#model_jars[@]} != 1 )); then
            echo "::error::Expected exactly one model JAR, found ${#model_jars[@]}."
            exit 1
          fi

          model_jar="${model_jars[0]}"
          expected_inventory="$(mktemp)"
          actual_inventory="$(mktemp)"
          expected_index="$(mktemp)"
          trap 'rm -f "$expected_inventory" "$actual_inventory" "$expected_index"' EXIT

          find schema/migrations -maxdepth 1 -type f -name 'V*.sql' \
            -printf '%f\n' | LC_ALL=C sort > "$expected_index"
          if [[ ! -s "$expected_index" ]]; then
            echo '::error::Canonical migration inventory is empty.'
            exit 1
          fi

          {
            echo postgresql-init.sql
            echo migrations/index.txt
            echo io/dsub/opendiscogs/schema/migrations/index.txt
            while IFS= read -r migration_name; do
              echo "migrations/$migration_name"
              echo "io/dsub/opendiscogs/schema/migrations/$migration_name"
            done < "$expected_index"
            find schema/contracts -type f -printf '%P\n' | LC_ALL=C sort |
              while IFS= read -r contract_name; do
                echo "contracts/$contract_name"
                echo "io/dsub/opendiscogs/schema/contracts/$contract_name"
              done
          } | LC_ALL=C sort > "$expected_inventory"

          jar --list --file "$model_jar" |
            awk '
              $0 == "postgresql-init.sql" ||
              $0 == "migrations/index.txt" ||
              $0 == "io/dsub/opendiscogs/schema/migrations/index.txt" ||
              $0 ~ /^migrations\/V[0-9][0-9][0-9]__[a-z0-9_]+\.sql$/ ||
              $0 ~ /^io\/dsub\/opendiscogs\/schema\/migrations\/V[0-9][0-9][0-9]__[a-z0-9_]+\.sql$/ ||
              $0 ~ /^contracts\/[^/].*$/ ||
              $0 ~ /^io\/dsub\/opendiscogs\/schema\/contracts\/[^/].*$/
            ' | LC_ALL=C sort > "$actual_inventory"
          diff --unified "$expected_inventory" "$actual_inventory"

          unzip -p "$model_jar" migrations/index.txt | cmp - "$expected_index"
          unzip -p "$model_jar" \
            io/dsub/opendiscogs/schema/migrations/index.txt |
            cmp - "$expected_index"

          while IFS= read -r migration_name; do
            unzip -p "$model_jar" "migrations/$migration_name" |
              cmp - "schema/migrations/$migration_name"
            unzip -p "$model_jar" \
              "io/dsub/opendiscogs/schema/migrations/$migration_name" |
              cmp - "schema/migrations/$migration_name"
          done < "$expected_index"

          while IFS= read -r contract_path; do
            unzip -p "$model_jar" "contracts/$contract_path" |
              cmp - "schema/contracts/$contract_path"
            unzip -p "$model_jar" \
              "io/dsub/opendiscogs/schema/contracts/$contract_path" |
              cmp - "schema/contracts/$contract_path"
          done < <(find schema/contracts -type f -printf '%P\n' | LC_ALL=C sort)

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs-created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}

  sign-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Import commit signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret: GPG_PRIVATE_KEY"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Sign Release Please commit
        shell: bash
        env:
          EXPECTED_BASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).baseBranchName }}
          RELEASE_PR_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_BASE_BRANCH" != "main" ]]; then
            echo "::error::Release Please pull request does not target main."
            exit 1
          fi
          if [[ ! "$RELEASE_PR_BRANCH" =~ ^release-please--branches--main--components--[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected Release Please branch."
            exit 1
          fi
          expected_head_sha="$(
            git rev-parse "refs/remotes/origin/$RELEASE_PR_BRANCH"
          )"
          if [[ "$(git rev-parse HEAD)" != "$expected_head_sha" ]]; then
            echo "::error::Checked-out commit does not match Release Please output."
            exit 1
          fi

          signing_key="$(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ -z "$signing_key" ]]; then
            echo "::error::No GPG secret key is available for commit signing."
            exit 1
          fi

          git config user.name state303
          git config user.email state303@dsub.io
          git config user.signingkey "$signing_key"
          git commit --amend --no-edit --gpg-sign="$signing_key"
          git verify-commit HEAD
          git push \
            --force-with-lease="refs/heads/$RELEASE_PR_BRANCH:$expected_head_sha" \
            origin \
            "HEAD:refs/heads/$RELEASE_PR_BRANCH"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Validate Release Please output
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release Please returned an invalid semantic version."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "::error::Release tag does not match the release version."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Checked-out commit does not match the release."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release commit is not on main."
            exit 1
          fi
          if [[ "$(tr -d '[:space:]' < version.txt)" != "$RELEASE_VERSION" ]]; then
            echo "::error::version.txt does not match the release version."
            exit 1
          fi

      - name: Check required secrets
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Import release signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Verify Go module
        run: |
          set -euo pipefail
          scripts/verify-generated-models.sh
          go test ./...

      - name: Verify release convergence on supported PostgreSQL versions
        run: scripts/test-release-convergence-contract.sh

      - name: Build Maven Central artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew clean build publishMavenJavaPublicationToCentralStagingRepository \
            -PreleaseVersion="$RELEASE_VERSION" \
            --no-daemon \
            --warning-mode=fail

      - name: Verify packaged schema resource inventory
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t model_jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print
          )
          if (( ${#model_jars[@]} != 1 )); then
            echo "::error::Expected exactly one model JAR, found ${#model_jars[@]}."
            exit 1
          fi

          model_jar="${model_jars[0]}"
          expected_inventory="$(mktemp)"
          actual_inventory="$(mktemp)"
          expected_index="$(mktemp)"
          trap 'rm -f "$expected_inventory" "$actual_inventory" "$expected_index"' EXIT

          find schema/migrations -maxdepth 1 -type f -name 'V*.sql' \
            -printf '%f\n' | LC_ALL=C sort > "$expected_index"
          if [[ ! -s "$expected_index" ]]; then
            echo '::error::Canonical migration inventory is empty.'
            exit 1
          fi

          {
            echo postgresql-init.sql
            echo migrations/index.txt
            echo io/dsub/opendiscogs/schema/migrations/index.txt
            while IFS= read -r migration_name; do
              echo "migrations/$migration_name"
              echo "io/dsub/opendiscogs/schema/migrations/$migration_name"
            done < "$expected_index"
            find schema/contracts -type f -printf '%P\n' | LC_ALL=C sort |
              while IFS= read -r contract_name; do
                echo "contracts/$contract_name"
                echo "io/dsub/opendiscogs/schema/contracts/$contract_name"
              done
          } | LC_ALL=C sort > "$expected_inventory"

          jar --list --file "$model_jar" |
            awk '
              $0 == "postgresql-init.sql" ||
              $0 == "migrations/index.txt" ||
              $0 == "io/dsub/opendiscogs/schema/migrations/index.txt" ||
              $0 ~ /^migrations\/V[0-9][0-9][0-9]__[a-z0-9_]+\.sql$/ ||
              $0 ~ /^io\/dsub\/opendiscogs\/schema\/migrations\/V[0-9][0-9][0-9]__[a-z0-9_]+\.sql$/ ||
              $0 ~ /^contracts\/[^/].*$/ ||
              $0 ~ /^io\/dsub\/opendiscogs\/schema\/contracts\/[^/].*$/
            ' | LC_ALL=C sort > "$actual_inventory"
          diff --unified "$expected_inventory" "$actual_inventory"

          unzip -p "$model_jar" migrations/index.txt | cmp - "$expected_index"
          unzip -p "$model_jar" \
            io/dsub/opendiscogs/schema/migrations/index.txt |
            cmp - "$expected_index"

          while IFS= read -r migration_name; do
            unzip -p "$model_jar" "migrations/$migration_name" |
              cmp - "schema/migrations/$migration_name"
            unzip -p "$model_jar" \
              "io/dsub/opendiscogs/schema/migrations/$migration_name" |
              cmp - "schema/migrations/$migration_name"
          done < "$expected_index"

          while IFS= read -r contract_path; do
            unzip -p "$model_jar" "contracts/$contract_path" |
              cmp - "schema/contracts/$contract_path"
            unzip -p "$model_jar" \
              "io/dsub/opendiscogs/schema/contracts/$contract_path" |
              cmp - "schema/contracts/$contract_path"
          done < <(find schema/contracts -type f -printf '%P\n' | LC_ALL=C sort)

      - name: Sign and package Maven Central bundle
        id: bundle
        shell: bash
        env:
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          bundle_path="$(scripts/prepare-central-bundle.sh "$RELEASE_VERSION")"
          echo "path=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Upload and publish through Maven Central
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          scripts/publish-central-bundle.sh \
            "${{ steps.bundle.outputs.path }}" \
            "io.dsub.opendiscogs:open-discogs-model-jooq:$RELEASE_VERSION"

      - name: Verify tagged Go module
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          set -euo pipefail
          GOPROXY=direct go list -m \
            "github.com/dsub-io/open-discogs-model@$RELEASE_TAG"

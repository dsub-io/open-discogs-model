plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.6'
}

group = 'io.dsub.opendiscogs'
def currentReleaseVersion = file('version.txt').getText('UTF-8').trim()
version = findProperty('releaseVersion') ?: "${currentReleaseVersion}-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.jooq:jooq:3.21.6'

    jooqCodegen(
            'org.slf4j:slf4j-simple:2.0.18',
            'org.postgresql:postgresql:42.7.13',
            'org.testcontainers:testcontainers-jdbc:2.0.5',
            'org.testcontainers:testcontainers-postgresql:2.0.5'
    )
}

publishing {
    repositories {
        maven {
            name = 'centralStaging'
            url = layout.buildDirectory.dir('central-staging')
        }
    }
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'open-discogs-jooq'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'DSUB OpenDiscogs jOOQ'
                description = 'jOOQ-generated schema classes for DSUB OpenDiscogs data services.'
                url = 'https://github.com/dsub-io/open-discogs-jooq'
                inceptionYear = '2021'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'state303'
                        name = 'state303'
                        email = 'state303@linux.com'
                        organization = 'DSUB'
                        organizationUrl = 'https://www.dsub.io'
                        roles = ['developer', 'maintainer']
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/dsub-io/open-discogs-jooq.git'
                    developerConnection =
                            'scm:git:ssh://git@github.com/dsub-io/open-discogs-jooq.git'
                    url = 'https://github.com/dsub-io/open-discogs-jooq'
                    tag = project.version.toString().endsWith('-SNAPSHOT')
                            ? 'HEAD'
                            : "v${project.version}"
                }

                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/dsub-io/open-discogs-jooq/issues'
                }
            }
        }
    }
}

jooq {
    configuration {
        logging = org.jooq.meta.jaxb.Logging.WARN
        jdbc {
            driver = 'org.testcontainers.jdbc.ContainerDatabaseDriver'
            url =
                    "jdbc:tc:postgresql:18.4-alpine:///databasename" +
                            "?TC_INITSCRIPT=file:${projectDir}" +
                            '/src/main/resources/postgresql-init.sql'
        }
        generator {
            name = 'org.jooq.codegen.JavaGenerator'
            database {
                inputSchema = 'public'
            }
            generate {
                deprecated = false
                records = true
                immutablePojos = false
                fluentSetters = true
                javaTimeTypes = true
                implicitJoinPathsToMany = false
                implicitJoinPathsManyToMany = false
            }
            target {
                packageName = 'io.dsub.opendiscogs.jooq'
                directory = 'build/generated-sources/jooq/main'
            }
            strategy {
                name = 'org.jooq.codegen.DefaultGeneratorStrategy'
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn(tasks.named('jooqCodegen'))
}

tasks.named('javadoc') {
    dependsOn(tasks.named('jooqCodegen'))
}

tasks.named('sourcesJar') {
    dependsOn(tasks.named('jooqCodegen'))
}

tasks.named('jooqCodegen') {
    inputs.file('src/main/resources/postgresql-init.sql')
}

def generatedSchemaDirectory =
        layout.buildDirectory.dir('generated-sources/jooq/main')

tasks.register('validateGeneratedSchema') {
    description = 'Checks the generated library contains the core OpenDiscogs schema.'
    group = 'verification'
    dependsOn(tasks.named('jooqCodegen'))
    inputs.dir(generatedSchemaDirectory)
    doLast {
        def expectedSources = [
                'io/dsub/opendiscogs/jooq/Tables.java',
                'io/dsub/opendiscogs/jooq/tables/Artist.java',
                'io/dsub/opendiscogs/jooq/tables/Label.java',
                'io/dsub/opendiscogs/jooq/tables/Master.java',
                'io/dsub/opendiscogs/jooq/tables/ReleaseItem.java',
                'io/dsub/opendiscogs/jooq/tables/records/ArtistRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/LabelRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/MasterRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/ReleaseItemRecord.java'
        ]
        def generatedDirectory = generatedSchemaDirectory.get()
        def missingSources = expectedSources.findAll {
            !generatedDirectory.file(it).asFile.isFile()
        }
        if (!missingSources.isEmpty()) {
            throw new GradleException(
                    "Generated schema is missing required sources:\n - "
                            + missingSources.join('\n - '))
        }
    }
}

def publicationPom = layout.buildDirectory.file('publications/mavenJava/pom-default.xml')

tasks.register('validatePublicationPom') {
    description = 'Checks Maven Central coordinates and public metadata.'
    group = 'verification'
    dependsOn(tasks.named('generatePomFileForMavenJavaPublication'))
    inputs.file(publicationPom)
    doLast {
        def pomText = publicationPom.get().asFile.getText('UTF-8')
        def requiredFragments = [
                '<groupId>io.dsub.opendiscogs</groupId>',
                '<artifactId>open-discogs-jooq</artifactId>',
                '<name>state303</name>',
                '<groupId>org.jooq</groupId>',
                '<artifactId>jooq</artifactId>',
                '<version>3.21.6</version>'
        ]
        def missingFragments = requiredFragments.findAll {
            !pomText.contains(it)
        }
        if (!missingFragments.isEmpty()) {
            throw new GradleException(
                    "Publication POM is missing required metadata:\n - "
                            + missingFragments.join('\n - '))
        }
    }
}

check.dependsOn(tasks.named('validateGeneratedSchema'))
check.dependsOn(tasks.named('validatePublicationPom'))

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Jar).configureEach {
    metaInf {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('NOTICE'))
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.7'
}

group = 'io.dsub.opendiscogs'
def currentReleaseVersion = file('version.txt').getText('UTF-8').trim()
version = findProperty('releaseVersion') ?: "${currentReleaseVersion}-SNAPSHOT"
def modelArtifactId = 'open-discogs-model-jooq'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        resources {
            srcDir 'schema'
            include 'contracts/**', 'migrations/**'
        }
    }
}

dependencies {
    api 'org.jooq:jooq:3.21.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.2'

    jooqCodegen(
            'org.slf4j:slf4j-simple:2.0.18',
            'org.postgresql:postgresql:42.7.13',
            'org.testcontainers:testcontainers-jdbc:2.0.5',
            'org.testcontainers:testcontainers-postgresql:2.0.5'
    )
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    repositories {
        maven {
            name = 'centralStaging'
            url = layout.buildDirectory.dir('central-staging')
        }
    }
    publications {
        mavenJava(MavenPublication) {
            artifactId = modelArtifactId
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'DSUB OpenDiscogs Model for jOOQ'
                description =
                        'jOOQ-generated Java models and canonical PostgreSQL migrations for DSUB OpenDiscogs.'
                url = 'https://github.com/dsub-io/open-discogs-model'
                inceptionYear = '2021'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'state303'
                        name = 'state303'
                        email = 'state303@linux.com'
                        organization = 'DSUB'
                        organizationUrl = 'https://www.dsub.io'
                        roles = ['developer', 'maintainer']
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/dsub-io/open-discogs-model.git'
                    developerConnection =
                            'scm:git:ssh://git@github.com/dsub-io/open-discogs-model.git'
                    url = 'https://github.com/dsub-io/open-discogs-model'
                    tag = project.version.toString().endsWith('-SNAPSHOT')
                            ? 'HEAD'
                            : "v${project.version}"
                }

                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/dsub-io/open-discogs-model/issues'
                }
            }
        }
    }
}

def migrationFiles = fileTree('schema/migrations') {
    include '*.sql'
}.files.sort { left, right -> left.name <=> right.name }
def combinedSchema = layout.buildDirectory.file('generated-schema/postgresql-init.sql')

tasks.register('prepareSchema') {
    description = 'Combines ordered PostgreSQL migrations for schema code generation.'
    group = 'build setup'
    inputs.files(migrationFiles)
    outputs.file(combinedSchema)
    doLast {
        def output = combinedSchema.get().asFile
        output.parentFile.mkdirs()
        output.withWriter('UTF-8') { writer ->
            migrationFiles.each { migration ->
                writer.write("-- ${migration.name}\n")
                writer.write(migration.getText('UTF-8'))
                writer.write('\n')
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('prepareSchema'))
    from(combinedSchema) {
        rename { 'postgresql-init.sql' }
    }
}

jooq {
    configuration {
        logging = org.jooq.meta.jaxb.Logging.WARN
        jdbc {
            driver = 'org.testcontainers.jdbc.ContainerDatabaseDriver'
            url =
                    "jdbc:tc:postgresql:18.4-alpine:///databasename" +
                            "?TC_INITSCRIPT=file:${projectDir}" +
                            '/build/generated-schema/postgresql-init.sql'
        }
        generator {
            name = 'org.jooq.codegen.JavaGenerator'
            database {
                inputSchema = 'public'
            }
            generate {
                deprecated = false
                records = true
                immutablePojos = false
                fluentSetters = true
                javaTimeTypes = true
                implicitJoinPathsToMany = false
                implicitJoinPathsManyToMany = false
            }
            target {
                packageName = 'io.dsub.opendiscogs.jooq'
                directory = 'build/generated-sources/jooq/main'
            }
            strategy {
                name = 'org.jooq.codegen.DefaultGeneratorStrategy'
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn(tasks.named('jooqCodegen'))
}

tasks.named('javadoc') {
    dependsOn(tasks.named('jooqCodegen'))
}

tasks.named('sourcesJar') {
    dependsOn(tasks.named('jooqCodegen'))
}

tasks.named('jooqCodegen') {
    dependsOn(tasks.named('prepareSchema'))
    inputs.files(migrationFiles)
}

def generatedSchemaDirectory =
        layout.buildDirectory.dir('generated-sources/jooq/main')

tasks.register('validateGeneratedSchema') {
    description = 'Checks the generated library contains the core OpenDiscogs schema.'
    group = 'verification'
    dependsOn(tasks.named('jooqCodegen'))
    inputs.dir(generatedSchemaDirectory)
    doLast {
        def expectedSources = [
                'io/dsub/opendiscogs/jooq/Tables.java',
                'io/dsub/opendiscogs/jooq/tables/Artist.java',
                'io/dsub/opendiscogs/jooq/tables/DiscogsDump.java',
                'io/dsub/opendiscogs/jooq/tables/DiscogsImportCheckpoint.java',
                'io/dsub/opendiscogs/jooq/tables/DiscogsImportRun.java',
                'io/dsub/opendiscogs/jooq/tables/DiscogsImportRunChunk.java',
                'io/dsub/opendiscogs/jooq/tables/DiscogsImportRunDump.java',
                'io/dsub/opendiscogs/jooq/tables/Label.java',
                'io/dsub/opendiscogs/jooq/tables/Master.java',
                'io/dsub/opendiscogs/jooq/tables/ReleaseItem.java',
                'io/dsub/opendiscogs/jooq/tables/records/ArtistRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/DiscogsDumpRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/DiscogsImportCheckpointRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/DiscogsImportRunRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/DiscogsImportRunChunkRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/DiscogsImportRunDumpRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/LabelRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/MasterRecord.java',
                'io/dsub/opendiscogs/jooq/tables/records/ReleaseItemRecord.java'
        ]
        def generatedDirectory = generatedSchemaDirectory.get()
        def missingSources = expectedSources.findAll {
            !generatedDirectory.file(it).asFile.isFile()
        }
        if (!missingSources.isEmpty()) {
            throw new GradleException(
                    "Generated schema is missing required sources:\n - "
                            + missingSources.join('\n - '))
        }
    }
}

def publicationPom = layout.buildDirectory.file('publications/mavenJava/pom-default.xml')

tasks.register('validatePublicationPom') {
    description = 'Checks Maven Central coordinates and public metadata.'
    group = 'verification'
    dependsOn(tasks.named('generatePomFileForMavenJavaPublication'))
    inputs.file(publicationPom)
    doLast {
        def pomText = publicationPom.get().asFile.getText('UTF-8')
        def requiredFragments = [
                '<groupId>io.dsub.opendiscogs</groupId>',
                '<artifactId>open-discogs-model-jooq</artifactId>',
                '<name>state303</name>',
                '<groupId>org.jooq</groupId>',
                '<artifactId>jooq</artifactId>',
                '<version>3.21.6</version>'
        ]
        def missingFragments = requiredFragments.findAll {
            !pomText.contains(it)
        }
        if (!missingFragments.isEmpty()) {
            throw new GradleException(
                    "Publication POM is missing required metadata:\n - "
                            + missingFragments.join('\n - '))
        }
    }
}

check.dependsOn(tasks.named('validateGeneratedSchema'))
check.dependsOn(tasks.named('validatePublicationPom'))

tasks.register('validateSchemaResources') {
    description = 'Checks the Java artifact ships every canonical schema migration.'
    group = 'verification'
    dependsOn(tasks.named('processResources'))
    inputs.files(migrationFiles)
    doLast {
        def missingMigrations = migrationFiles.findAll {
            !layout.buildDirectory.file("resources/main/migrations/${it.name}")
                    .get().asFile.isFile()
        }
        if (!layout.buildDirectory.file('resources/main/postgresql-init.sql')
                .get().asFile.isFile()) {
            throw new GradleException(
                    'Java resources are missing the generated postgresql-init.sql')
        }
        if (!missingMigrations.isEmpty()) {
            throw new GradleException(
                    "Java resources are missing schema migrations:\n - "
                            + missingMigrations*.name.join('\n - '))
        }
    }
}

check.dependsOn(tasks.named('validateSchemaResources'))

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Jar).configureEach {
    metaInf {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('NOTICE'))
    }
}
